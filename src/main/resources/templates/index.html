<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazyn Kosiarkobot 2.0</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Magazyn Robotów - Kosiarkobot 2.0</h1>

    <table>
        <thead>
            <tr>
                <th>Producent</th>
                <th>Model</th>
                <th>Typ</th>
                <th>Powierzchnia (m²)</th>
                <th>Cena (PLN)</th>
                <th>Ilość</th>
                <th>Akcja</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="robot : ${roboty}">
                <td th:text="${robot.producent}"></td>
                <td th:text="${robot.model}"></td>
                <td th:text="${robot.typ}"></td>
                <td th:text="${robot.area}"></td>
                <td th:text="${robot.cena}"></td>
                <td th:text="${robot.ilosc}"></td>
                <td>
                    <a th:href="@{/usun/{id}(id=${robot.id})}" class="btn-usun" 
                       onclick="return confirm('Czy na pewno chcesz usunąć tego robota?')">Usuń</a>
                </td>
            </tr>
        </tbody>
    </table>

    <p class="summary">
        Całkowita wartość magazynu: 
        <span th:text="${#numbers.formatDecimal(sumaWartosci, 1, 2, 'COMMA')}">0,00</span> PLN
    </p>

    <hr>

    <h2>Dodaj nowy sprzęt</h2>
    <form th:action="@{/dodaj}" th:object="${nowyRobot}" method="post">
        
        <div class="form-group">
            <div>
                <label>Producent:</label>
                <input type="text" th:field="*{producent}" placeholder="np. Husqvarna" required>
            </div>
            <div>
                <label>Model:</label>
                <input type="text" th:field="*{model}" placeholder="np. Automower" required>
            </div>
            <div>
                <label>Typ robota:</label>
                <select th:field="*{typ}">
                    <option value="Koszący">Koszący</option>
                    <option value="Czyszczący">Czyszczący</option>
                    <option value="Basenowy">Basenowy</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <div>
                <label>Powierzchnia (m²):</label>
                <input type="number" th:field="*{area}" required min="0">
            </div>
            <div>
                <label>Cena (PLN):</label>
                <input type="number" step="0.01" th:field="*{cena}" required min="0">
            </div>
            <div>
                <label>Ilość sztuk:</label>
                <input type="number" th:field="*{ilosc}" required min="0">
            </div>
        </div>

        <button type="submit" class="btn-dodaj">Zapisz w bazie danych</button>
    </form>
</div>

</body>
</html>
