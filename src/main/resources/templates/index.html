<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Magazyn Kosiarkobot 2.0</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .form-group { margin-bottom: 15px; }
        input, select { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-dodaj { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
        .btn-usun { color: #e74c3c; text-decoration: none; font-weight: bold; }
        .summary { font-size: 1.2em; font-weight: bold; text-align: right; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <h1>Magazyn Robotów - Kosiarkobot 2.0</h1>

    <table>
        <thead>
            <tr>
                <th>Producent</th>
                <th>Model</th>
                <th>Typ</th>
                <th>Powierzchnia (m²)</th>
                <th>Cena (PLN)</th>
                <th>Ilość</th>
                <th>Akcja</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="robot : ${roboty}">
                <td th:text="${robot.producent}"></td>
                <td th:text="${robot.model}"></td>
                <td th:text="${robot.typ}"></td>
                <td th:text="${robot.area}"></td>
                <td th:text="${robot.cena}"></td>
                <td th:text="${robot.ilosc}"></td>
                <td>
                    <a th:href="@{/usun/{id}(id=${robot.id})}" class="btn-usun" 
                       onclick="return confirm('Czy na pewno chcesz usunąć tego robota?')">Usuń</a>
                </td>
            </tr>
        </tbody>
    </table>

    <p class="summary">Całkowita wartość magazynu: <span th:text="${#numbers.formatDecimal(sumaWartosci, 1, 2)}">0.00</span> PLN</p>

    <hr>

    <h2>Dodaj nowy sprzęt</h2>
    <form th:action="@{/dodaj}" th:object="${nowyRobot}" method="post">
        <div class="form-group">
            <input type="text" th:field="*{producent}" placeholder="Producent" required>
            <input type="text" th:field="*{model}" placeholder="Model" required>
            <select th:field="*{typ}">
                <option value="Koszący">Koszący</option>
                <option value="Czyszczący">Czyszczący</option>
                <option value="Basenowy">Basenowy</option>
            </select>
        </div>
        <div class="form-group">
            <input type="number" th:field="*{area}" placeholder="Powierzchnia (m²)" required>
            <input type="number" step="0.01" th:field="*{cena}" placeholder="Cena (PLN)" required>
            <input type="number" th:field="*{ilosc}" placeholder="Ilość sztuk" required>
        </div>
        <button type="submit" class="btn-dodaj">Zapisz w bazie danych</button>
    </form>
</div>

</body>
</html>
