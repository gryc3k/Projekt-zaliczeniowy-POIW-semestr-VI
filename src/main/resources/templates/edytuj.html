<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edycja robota</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body { padding: 40px; color: white; background-color: #1a1a1a; }
        .form-container { max-width: 500px; padding: 20px; border: 1px solid #333; }
        input { margin-bottom: 15px; width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        a { color: #f44336; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>

    <h2>Edytuj dane robota</h2>

    <div class="form-container">
        <form th:action="@{/dodaj}" th:object="${robot}" method="post">
            
            <input type="hidden" th:field="*{id}" />

            <label>Producent:</label>
            <input type="text" th:field="*{producent}" required />

            <label>Model:</label>
            <input type="text" th:field="*{model}" required />

            <label>Typ robota:</label>
            <input type="text" th:field="*{typ}" required />

            <label>Powierzchnia (m2):</label>
            <input type="number" th:field="*{area}" required />

            <label>Cena (PLN):</label>
            <input type="number" step="0.01" th:field="*{cena}" required />

            <label>Ilość:</label>
            <input type="number" th:field="*{ilosc}" required />

            <button type="submit">Zapisz zmiany</button>
            <a th:href="@{/}">Anuluj i wróć</a>
        </form>
    </div>

</body>
</html>
