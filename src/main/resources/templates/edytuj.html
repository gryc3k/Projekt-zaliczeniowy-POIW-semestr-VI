<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edycja robota</title>
</head>
<body>
    <h2>Edytuj dane robota</h2>
    <form th:action="@{/dodaj}" th:object="${robot}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label>Producent:</label>
        <input type="text" th:field="*{producent}" required />

        <label>Model:</label>
        <input type="text" th:field="*{model}" required />

        <label>Typ robota:</label>
        <input type="text" th:field="*{typ}" required />

        <label>Powierzchnia (m2):</label>
        <input type="number" th:field="*{area}" required />

        <label>Cena (PLN):</label>
        <input type="number" step="0.01" th:field="*{cena}" required />

        <label>Ilość:</label>
        <input type="number" th:field="*{ilosc}" required />

        <button type="submit">Zapisz zmiany</button>
        <a th:href="@{/}">Anuluj</a>
    </form>
</body>
</html>
